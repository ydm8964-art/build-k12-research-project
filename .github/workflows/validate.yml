name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m ruff check skills/build-k12-research-project/scripts
      - run: python -m compileall -q skills/build-k12-research-project/scripts
      - run: python -m unittest discover -s tests -v
