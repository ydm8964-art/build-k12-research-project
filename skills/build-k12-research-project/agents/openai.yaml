interface:
  display_name: "中小学课题全流程生成"
  short_description: "一次采集信息，从选题到申报、实施、数据、照片和结题生成完整材料"
  default_prompt: "使用 $build-k12-research-project 根据我的基本信息和中小学具体学科推荐课题；题目确认后采用通用底座加学科专项证据规则，按当年官方模板一次性生成申报、实施工具、Word表格、XLSX台账、真实照片证据、中期和结题全生命周期材料，并在材料包根目录生成真实照片、原始材料、学科专项风险、时间逻辑和增强建议注意事项文件，按真实阶段标注可用状态和完成整套终审。"
