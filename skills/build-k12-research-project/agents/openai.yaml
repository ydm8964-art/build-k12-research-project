interface:
  display_name: "中小学课题全流程生成"
  short_description: "实时核验政策，规范选题并生成、审计和打包全套中小学课题材料"
  default_prompt: "使用 $build-k12-research-project 根据我的学校、学段、学科、班级和真实问题先重新检索当年官方政策与模板，再生成5—8个课题选题；我确认候选ID后建立唯一主清单，持续生成申请、开题、工具、Word、XLSX、课例案例、照片待办、中期、研究报告和结题材料，严格审计标题正文格式、真实性、时间与证据，最后交付带预检报告和SHA-256清单的整套ZIP。"
