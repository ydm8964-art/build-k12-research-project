interface:
  display_name: "中小学课题全流程生成"
  short_description: "输入教师基本情况，先选题，再按依赖生成并验收全套课题材料"
  default_prompt: "使用 $build-k12-research-project 根据我的学校、学段、学科、班级和真实问题先生成5—8个可比较的课题选题；我确认候选ID后，只补问会改变申报或研究事实的关键字段，建立唯一主清单，并按材料任务计划持续生成申请、开题、研究工具、Word表格、XLSX数据、课例案例、真实照片待办、中期、研究报告和结题材料。优先采用当年官方模板，缺少真实数据、照片、签章或官方意见时保留结构完整工作稿和明确待办，不得虚构；完成逐份格式、渲染、隐私、时间、学科事实和整套一致性验收。"
